services:
  fooddetector:
    image: aliyun-docker-harbor-registry.cn-hangzhou.cr.aliyuncs.com/roki-ai/roki-ai-food-detector-model:2026110201
    container_name: food_detector
    volumes:
      - ./output:/app/output
    environment:
      # 空值使用 prod，任意非空值使用 test。
      - NACOS_ENV=${NACOS_ENV:-}
      # 宿主机设置此变量则直接读取本地 YAML（包括空值）；未设置则读取 Nacos。
      # 也可直接改为 NACOS_USE_LOCAL=1；不要给未设置的变量填默认空值。
      - NACOS_USE_LOCAL
    ports:
      - "8695:8695"
    command: python3.11 -m uvicorn main:app --host 0.0.0.0 --port 8695
    stdin_open: true         # 等效于 -i
    tty: true                # 等效于 -t
    restart: unless-stopped  # 容器在异常退出时自动重启，适合后台运行
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]