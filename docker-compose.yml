services:
  fooddetector:
    image: aliyun-docker-harbor-registry.cn-hangzhou.cr.aliyuncs.com/roki-ai/roki-ai-food-detector-model:20250609
    container_name: food_detector
    environment:
      # NACOS_ENABLED=True 时：空值使用 prod，任意非空值使用 test。
      NACOS_ENV: "${NACOS_ENV:-}"
    ports:
      - "8695:8695"
    command: python3.11 -m uvicorn main:app --host 0.0.0.0 --port 8695
    stdin_open: true         # 等效于 -i
    tty: true                # 等效于 -t
    restart: unless-stopped  # 容器在异常退出时自动重启，适合后台运行
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia          # 仅旧版 docker 需要，新版用 --gpus 会自动处理
